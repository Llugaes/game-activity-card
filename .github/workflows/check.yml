name: Component checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - run: npm pack --dry-run
      - name: Prepare independent consumer
        run: mkdir -p .tmp/consumer
      - uses: ./
        with:
          root: .tmp/consumer
          mode: sync
          platforms: steam
      - name: Verify consumer artifacts and offline rendering
        run: |
          test -s .tmp/consumer/data/activity.json
          test -s .tmp/consumer/assets/player-log.webp
          test -s .tmp/consumer/assets/player-log-mobile.webp
          test -s .tmp/consumer/docs/ACTIVITY.md
          node bin/player-log.mjs render --root .tmp/consumer
